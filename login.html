<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-container">
    <h2>Login</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="login-btn">Log In</button>
    <p class="switch">Don't have an account? <a href="signup.html">Sign Up</a></p>

    <p id="error" style="color:red;"></p>
  </div>

  <script type="module">
    import { auth } from './firebase.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

    const loginBtn = document.getElementById('login-btn');
    const errorElement = document.getElementById('error');

    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      errorElement.textContent = "";

      if (!email || !password) {
        errorElement.textContent = "Enter both email and password.";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Logged in successfully!");
        window.location.href = 'homepage/main.html';
      } catch (error) {
        if (error.code === "auth/user-not-found") {
          errorElement.textContent = "No account found with this email. Please sign up.";
        } else if (error.code === "auth/wrong-password") {
          errorElement.textContent = "Incorrect password.";
        } else if (error.code === "auth/invalid-email") {
          errorElement.textContent = "Invalid email format.";
        } else {
          errorElement.textContent = error.message;
        }
      }
    });
  </script>
</body>
</html>
